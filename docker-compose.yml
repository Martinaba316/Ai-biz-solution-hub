services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASS}
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mariadb:/var/lib/mysql

  redis:
    image: redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - "20"
      - "1"
      - --loglevel
      - warning
    volumes:
      - ./redis:/data

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_started
      redis:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASS}
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_HOME', 'https://aibizsolutions.org');
        define('WP_SITEURL', 'https://aibizsolutions.org');
    volumes:
      - ./wordpress:/var/www/html

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_PORT: ${N8N_PORT:-5678}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/New_York}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CALENDLY_URL: ${CALENDLY_URL}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
    volumes:
      - ./n8n:/home/node/.n8n
    ports:
      - "5678:5678"

  endpoints:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./endpoints:/app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      N8N_BASE_URL: ${WEBHOOK_URL}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
    ports:
      - "3000:3000"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_ORIGINS: "*"
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ./ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  ollama-init:
    image: curlimages/curl:8.10.1
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      until curl -sSf http://ollama:11434/api/version > /dev/null; do
        echo "Waiting for Ollama to become ready..."
        sleep 2
      done
      curl -sSf -X POST http://ollama:11434/api/pull \
        -H "Content-Type: application/json" \
        -d "{\"name\":\"$${OLLAMA_MODEL}\"}"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
    restart: "no"
